services:
  tcg-watcher:
    build: ./app
    container_name: tcg-watcher-codex
    restart: "no"
    volumes:
      - ./data:/data
      - F:/OPTCG_Images:/images:ro
      - ./secrets/service_account.json:/run/secrets/service_account.json:ro
    env_file:
      - ./.env
    environment:
      IMAGES_ROOT: /images
      IMPORT_WEBHOOK_URL: https://script.google.com/macros/s/AKfycbzJDXtAwsUrAAGZbAhOerIsLUJhiJXMZT2Jv6lvqOy5hlw8S9s805-HDPlTj7YwKmWBgA/exec
      IMPORT_WEBHOOK_TOKEN: OPTCG_import_8eF3kLm92QaTzX7vRw5Hp1YcN6uB4s
      SHEET_NAME: Watchlist
      TZ: America/Los_Angeles
      PYTHONUNBUFFERED: 1
      DISCORD_WEBHOOK_URL: ""

  tcg-dashboard:
    build: ./pm
    container_name: tcg-dashboard-codex
    restart: "no"
    ports:
      - "18080:8080"
    volumes:
      - ./data:/data
      - F:/OPTCG_Images:/images:ro
      - D:/docker/tcg-watcher/data:/runtime-data:ro
    environment:
      PORT: "8080"
      TZ: America/Los_Angeles
      MIRU_RUNTIME_DOSSIER_DB_PATH: /runtime-data/miru_learning_dossiers.db
      MIRU_RUNTIME_IMAGES_ROOT: /runtime-data/miru_images
      MIRU_AI_PORT: "18765"
