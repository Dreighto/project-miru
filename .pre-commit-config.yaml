# Pre-PR hygiene layer (PRO-107).
# Hooks fire on git commit (pre-commit stage) and git push (pre-push stage).
# Bypass policy: --no-verify allowed only for emergency hotfixes; must be logged
# in the commit message ("HYGIENE BYPASS: <reason>"). See CLAUDE.md ## Hygiene gate.
# Legacy files (those not touched by the current PR) are NOT subject to retroactive
# enforcement — hooks fire on changed files only, by pre-commit's default behavior.

# Install both pre-commit and pre-push hook stages by default. Without this,
# `pre-commit install` only wires up .git/hooks/pre-commit and the
# safe-git-push gate (DGAS Tier 2 #8) is silently skipped on `git push`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Append-only jsonl files under data/ are NEVER rewritten by any tool.
      # Stripping trailing whitespace or normalizing EOF is a read-modify-write
      # truncation, which violates the strict append-only contract enforced by
      # the CC Completion Ping watcher (PRO-159). cc_completion_log.jsonl is
      # the only currently-tracked file in this set, but excluding the whole
      # data/*.jsonl glob future-proofs the rule.
      # archive/ holds preserved snapshots and reference HTML/CSS captured at
      # a point in time. Reformatting them defeats their purpose.
      - id: trailing-whitespace
        # miru_ai/static/ + pm/storefront/build/ are Vite build output
        # (minified bundles). Rewriting them is harmful — the next
        # `npm run build` regenerates them and the trailing-whitespace
        # normalization just churns the diff.
        exclude: ^(data/.*\.jsonl$|archive/|miru_ai/static/|pm/storefront/build/)
      - id: end-of-file-fixer
        exclude: ^(data/.*\.jsonl$|archive/|miru_ai/static/|pm/storefront/build/)
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
        # Workflow JSONs are validated by the dedicated n8n schema hook below.
        exclude: ^docker/n8n/workflows/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, css, html, markdown]
        # archive/ snapshots stay in original form (see end-of-file-fixer note).
        # miru_ai/static/ + pm/storefront/build/ are Vite output (see above).
        exclude: ^(docker/n8n/workflows/|archive/|miru_ai/static/|pm/storefront/build/)

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.16.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        exclude: ^docker/n8n/workflows/

  # DGAS Tier 1: pre-commit secret scanning. Catches AWS keys, GitHub PATs,
  # API tokens, private keys, and high-entropy strings before they reach
  # any commit. Allowlist for known-safe paths (research dumps, archive
  # snapshots, test fixtures) lives in .gitleaks.toml. See
  # data/peer_reviews/2026-05-08_dgas_three_way_synthesis.md item #4.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: n8n-workflow-schema
        name: n8n workflow JSON schema validation
        entry: python tools/validate_n8n_workflow.py
        language: system
        files: ^docker/n8n/workflows/.*\.json$
        # Partial workflow pieces (merged into W7 by script); not full exports.
        exclude: ^docker/n8n/workflows/fragments/
        pass_filenames: true

      - id: jsonl-line-validation
        name: JSONL append-only line validation
        entry: python tools/validate_jsonl.py
        language: system
        files: \.jsonl$
        pass_filenames: true

      # 2026-05-11: CodeRabbit caught a regression on
      # `windows/register_restart_tasks.ps1` where a scheduled-task
      # `-Description` embedded a literal `D:\dev\miru\windows\startup_all.ps1`.
      # That breaks on any machine where the install path differs. This
      # hook is the structural guard against that class of bug — it rejects
      # any -Description "..." string containing a Windows or POSIX absolute
      # path under common dev/work roots. Coverage is intentionally narrow
      # to keep false positives near zero.
      - id: ps1-hardcoded-paths
        name: PowerShell -Description hardcoded path detector
        entry: python tools/check_ps1_hardcoded_paths.py
        language: system
        # CR R4 (PR #3): case-insensitive match. Windows file systems are
        # case-insensitive so `.PS1` / `.Ps1` would silently bypass a
        # case-sensitive regex.
        files: (?i)\.ps1$
        pass_filenames: true

      # DGAS Tier 2 #8: pre-push gate that refuses force-push or branch-delete
      # on protected branches (main, master, release/*). Defense-in-depth
      # alongside the GitHub branch protection ruleset — local rejection
      # before the network call. Bypass with `git push --no-verify` only for
      # emergency hotfixes (log the bypass in the commit message).
      - id: safe-git-push
        name: DGAS safe-git-push (refuse force-push/delete on protected branches)
        entry: python tools/check_safe_git_push.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # Pytest pre-push hook intentionally omitted per operator ruling 2026-04-25.
      # CI (`.github/workflows/hygiene.yml`) runs pytest authoritatively on every PR.
      # Local pre-push pytest will be re-enabled once the test suite debt is cleared
      # (PRO-109): 33 pre-existing failures across 7 files surfaced during PRO-107
      # build (env var drift, schema drift, identity-truth-lock data, threshold drift).
      # `conftest.py` at repo root stays — it fixes a latent sys.path bug regardless.
