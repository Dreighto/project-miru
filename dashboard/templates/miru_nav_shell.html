<!doctype html>
<html lang="en" data-page="{% block data_page %}miru-shell{% endblock %}">

<head>
  <meta name='impact-site-verification' value='997abe74-28bd-48dc-a44e-8df18d6fb375' />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#08060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="{% block meta_description %}Project Miru{% endblock %}">
  <title>{% block title %}Miru{% endblock %} — Miru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/miru-base.css">
  <style>
    .appBarPageLabel {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.58);
      margin: 0;
    }

    /* Match index.html: main column + readable line length for shell pages */
    .appFrame {
      width: min(1040px, 100%);
      max-width: 100%;
      margin: 0 auto;
      overflow-x: hidden;
    }

    .miruShellPageBody {
      width: min(780px, 100%);
      margin: 0 auto;
    }

    .miruShellPageTitle {
      font-family: var(--font-display);
      font-size: clamp(19px, 4.6vw, 25px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.22;
      margin: 8px 0 6px;
      color: white;
    }

    .bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    /*
     * Opt-in bottom-nav suppression: mark a focusable with data-suppresses-bottom-nav="true".
     * While focused (including during scroll), body gets .miru-bottom-nav-suppressed — see shell script.
     */
    body.miru-bottom-nav-suppressed #bottomNav {
      visibility: hidden;
      pointer-events: none;
    }

    /* Reserve space for fixed bottom nav (~64px row + home indicator safe area). */
    body {
      padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    }

  </style>
  {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
  <header class="appBar" id="appBar" aria-label="App bar">
    <div class="appBarLeft">
      <span class="appBarPageLabel" aria-hidden="true">{{ app_bar_page_label }}</span>
    </div>
    <a href="/" class="appBarLogoWrap" id="appBarLogoWrap" aria-label="Project Miru home">
      <div class="appBarLogo" aria-hidden="true">
        <img class="brandLogoCompass" src="{{ url_for('static', filename='icons/pm_compass.png') }}" alt="" width="64"
          height="64" decoding="async" fetchpriority="high">
        <span class="brandLogoFruitWrap">
          <img class="brandLogoFruit" src="{{ url_for('static', filename='icons/pm_fruit.png') }}" alt="Miru" width="64"
            height="64" decoding="async">
        </span>
      </div>
    </a>
    <div class="appBarRight" aria-hidden="true"></div>
  </header>
  <div class="appBarSpacer" aria-hidden="true"></div>

  {# Same order as index.html / leaders: fixed bottom nav in DOM before scrollable main #}
  <nav class="bottomNav" id="bottomNav" aria-label="Main navigation">
    <div class="bottomNavDock">
      {{ bottom_nav_html | safe }}
    </div>
  </nav>

  <main class="appFrame" id="mainContent">
    {% block page_body %}{% endblock %}
  </main>
  <script>
    (function () {
      var appBar = document.getElementById("appBar");
      if (!appBar) return;
      var COMPACT_THRESHOLD = 100;
      var ticking = false;
      var lastCompact = null;
      function applyCompact() {
        ticking = false;
        var compact = (window.scrollY || 0) > COMPACT_THRESHOLD;
        if (compact === lastCompact) return;
        lastCompact = compact;
        if (compact) appBar.classList.add("appBar--compact");
        else appBar.classList.remove("appBar--compact");
      }
      function onScroll() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(applyCompact);
        }
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      applyCompact();
    })();

    /* Opt-in: hide #bottomNav while any [data-suppresses-bottom-nav="true"] is focused — no viewport math. */
    (function () {
      var SEL = "[data-suppresses-bottom-nav=\"true\"]";
      var CLASS = "miru-bottom-nav-suppressed";
      function matchesSuppressing(el) {
        return !!(el && el.matches && el.matches(SEL));
      }
      document.addEventListener(
        "focusin",
        function (e) {
          if (matchesSuppressing(e.target)) {
            document.body.classList.add(CLASS);
          }
        },
        true
      );
      document.addEventListener(
        "focusout",
        function () {
          window.setTimeout(function () {
            var ae = document.activeElement;
            if (matchesSuppressing(ae)) return;
            document.body.classList.remove(CLASS);
          }, 0);
        },
        true
      );
    })();

  </script>
</body>

</html>
