# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Project Miru — CodeRabbit configuration
#
# 2026-05-11 (morning): Switched from assertive→chill profile after multi-round
# nitpick cycles consumed disproportionate operator + worker tokens. The
# trade-off is explicit: CR catches fewer surface-level style issues
# automatically; we rely on local hooks (pre-commit framework +
# tools/pre_pr_review.py CR-pattern detector suite +
# tools/check_ps1_hardcoded_paths.py) to enforce hygiene at commit/push time
# before code ever reaches CR.
#
# 2026-05-11 (evening): CR AUTOFIX BETA IS OFF — DO NOT INVOKE.
# Two data points from today (LogueOS-Orchestrator PRs):
#   - PR #9: autofix touched 1 file, fixed exactly the precedence bug we
#     described. Tight, correct, helpful.
#   - PR #11: autofix touched 24 unrelated files (gatekeeper modules,
#     dashboard tests, sentinel health) from 2 review comments. Scope
#     explosion, and ruff STILL failed afterwards. Recovery required a
#     hard reset of the branch.
# Operator directive: leave autofix off until CR's behavior is predictable
# enough that the scope-explosion failure mode cannot recur. Manually apply
# CR's suggestions on files YOU touched in the PR — never invoke autofix.
# DO NOT comment `@coderabbitai apply` or click the autofix UI button on
# any PR in this repo until this policy is revised.
#
# What changed vs the previous config:
#   - profile: assertive → chill
#   - request_changes_workflow: true → false  (CR comments are advisory; the
#     CHANGES_REQUESTED state used to block merges even on trivial nits)
#   - other_finishing_touches: true → false   (no auto-suggested fix nits)
#   - path_instructions kept ONLY the genuinely critical invariants
#     (append-only data files, DB write detection, governance canon files,
#     port boundary). Dropped the noisier service-boundary import lints for
#     miru_ai/pm/dispatcher — those are routine code, local hooks catch
#     real problems, and CR's lint output on them was mostly nitpicks.
#
# What stayed the same:
#   - auto_review enabled on PRs targeting main
#   - path_filters excluding append-only JSONL from review entirely

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  path_filters:
    - "!data/cc_completion_log.jsonl"
    - "!data/routing_history.jsonl"
    - "!data/pending_callbacks.jsonl"
    - "!data/dispatch_dlq.jsonl"
    - "!data/cc_heartbeat_log.jsonl"
    - "!data/vp_ops_supervision.jsonl"
    - "!data/drift_scanner_log.jsonl"
    - "!data/agent_decisions.jsonl"
    - "!data/github_resource_ledger.jsonl"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Path-specific review instructions — kept only the genuinely critical
  # invariants. Style nits are caught locally by pre-commit hooks.
  path_instructions:

    # Append-only JSONL files — existing rows are immutable history
    - path: "data/*.jsonl"
      instructions: |
        These files are strictly APPEND-ONLY per CLAUDE.md and are validated by
        tests/test_jsonl_append_only_invariant.py. Never suggest in-place edits,
        deletions, sorting, deduplication, or any mutation of existing rows.
        Only fs.appendFileSync or shell >> is permitted. If you see a "wrong"
        value in an existing row, it is the canonical historical record; propose
        a follow-up event row, not an edit.

    # n8n workflow JSON — JS boundary-crossing test required (real invariant)
    - path: "docker/n8n/workflows/**/*.json"
      instructions: |
        If this diff touches any jsCode field in a workflow node, verify that a
        corresponding test loads the JSON from disk via fs.readFileSync/JSON.parse,
        extracts the jsCode string, and evals it (new Function or vm.Script) to confirm
        it parses without SyntaxError. A test that imports a clean extracted copy of
        the algorithm instead of the embedded jsCode string does NOT satisfy this
        requirement.

    # Database artifact — never commit .db
    - path: "data/**/*.db"
      instructions: |
        .db files are runtime artifacts and must never be committed. Flag any diff
        that adds or modifies a .db binary file.

    # Services — guard reserved port assignments
    - path: "services/**"
      instructions: |
        Port 8765 must NEVER be touched. Port 8080 is RESERVED. Flag any change
        that assigns, reassigns, or references port 8765 or 8080 for a new service.

    # Tests — no DB mocks (real invariant from a past incident)
    - path: "tests/**"
      instructions: |
        Integration tests must not mock card_catalog.db. Real DB access via
        sqlite-ro-snapshot is required.

    # Operator-controlled canon
    - path: "CLAUDE.md"
      instructions: |
        Operator-controlled canon. Flag any change that removes or weakens a
        Hard Rule section without a corresponding operator decision noted in
        the diff description.

    - path: "AGENTS.md"
      instructions: "Operator-controlled canon. Hard Rules must not be weakened silently."

    - path: "data/cc_completion_log.jsonl"
      instructions: |
        Append-only. Every new line must be a valid JSON object with required
        fields: timestamp, ticket_id, status, summary, files_touched, test_evidence.

  # Finishing touches — don't auto-suggest docstrings or other nits
  finishing_touches:
    docstrings:
      enabled: false
    other_finishing_touches:
      enabled: false

knowledge_base:
  mcp:
    usage: "enabled"
  learnings:
    scope: "auto"

chat:
  auto_reply: true
