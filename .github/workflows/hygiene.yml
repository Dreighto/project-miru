# Pre-PR hygiene CI gate (PRO-107).
# Mirrors the local pre-commit hooks. Catches anyone bypassing pre-commit with
# --no-verify by re-running the same checks on the PR before merge.
# Phased rollout: hooks fire on changed files only (pre-commit's default scope);
# legacy code is grandfathered until touched. See CLAUDE.md ## Hygiene gate.

name: Pre-PR Hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history so --from-ref/--to-ref can resolve PR base.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks (changed files only — phased rollout per PRO-107)
        # Mirrors the local hygiene gate's phased rollout: legacy files are
        # grandfathered until touched. Hooks fire only on files changed by the
        # current PR (or the latest push to main).
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            pre-commit run --from-ref "${{ github.event.pull_request.base.sha }}" --to-ref "${{ github.event.pull_request.head.sha }}"
          else
            pre-commit run --from-ref HEAD~1 --to-ref HEAD
          fi

      - name: Run tests (pre-existing failures tracked in PRO-109)
        # Test-suite debt: 7 files have collection or runtime failures unrelated
        # to PRO-107. They are --ignored here so CI can give clean signal on the
        # rest. Each ignore should be removed by PRO-109 as it cleans the file.
        # Continue-on-error: the existing-test-debt baseline is informational
        # data for PRO-109, not a hard gate yet. Set strict: true once PRO-109
        # ships (remove this comment + the continue-on-error line).
        continue-on-error: true
        run: |
          pip install pytest pytest-timeout
          pytest tests/ --tb=short -q --timeout=30 \
            --ignore=tests/test_dashboard_app.py \
            --ignore=tests/test_miru_ai_server.py \
            --ignore=tests/test_miru_project_sync.py \
            --ignore=tests/test_miru_learning_engine.py \
            --ignore=tests/test_miru_card_intel.py \
            --ignore=tests/test_miru_image_ingestion.py \
            --ignore=tests/test_miru_source_registry.py
