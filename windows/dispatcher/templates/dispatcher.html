<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Miru Task Dispatcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='dispatcher.css') }}" />
</head>
<body>
<header class="header">
  <div class="header-inner">
    <span class="header-dot"></span>
    <span class="header-title">Miru Dispatcher</span>
    <span class="header-port">:19000</span>
  </div>
</header>

<main>
  <div id="stats-bar" class="stats-bar" aria-live="polite"></div>

  <section aria-label="Submit a new job">
    <h2>Submit Job</h2>
    <form id="job-form" autocomplete="off">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" placeholder="Describe the task..." required aria-describedby="char-count"></textarea>
      <div id="char-count" class="char-count" aria-live="off">0 / 2000</div>
      <label id="lbl-model">Model</label>
      <div class="seg-group" data-field="model" role="radiogroup" aria-labelledby="lbl-model">
        <button type="button" class="seg active" role="radio" aria-checked="true">Claude Code</button>
        <button type="button" class="seg" role="radio" aria-checked="false">Cursor</button>
        <button type="button" class="seg" role="radio" aria-checked="false">ChatGPT</button>
        <button type="button" class="seg" role="radio" aria-checked="false">Codex</button>
      </div>
      <label id="lbl-effort">Effort</label>
      <div class="seg-group" data-field="effort" role="radiogroup" aria-labelledby="lbl-effort">
        <button type="button" class="seg" role="radio" aria-checked="false">Quick</button>
        <button type="button" class="seg active" role="radio" aria-checked="true">Standard</button>
        <button type="button" class="seg" role="radio" aria-checked="false">Deep</button>
      </div>
      <button type="submit" class="primary">Dispatch</button>
    </form>
  </section>

  <section aria-label="Active jobs">
    <h2>Live Jobs</h2>
    <div id="live-jobs" class="jobs"><div class="empty"><div class="empty-icon">&#9673;</div>No active jobs</div></div>
  </section>

  <section aria-label="Completed jobs">
    <h2>Job History</h2>
    <div id="hist-jobs" class="jobs"><div class="empty"><div class="empty-icon">&#9776;</div>No completed jobs yet</div></div>
  </section>

  <section aria-label="Operator controls">
    <h2>Operator</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="ghost" id="btn-logs">View Logs</button>
      <button class="ghost danger" id="btn-restart">Restart</button>
    </div>
    <div id="log-view" style="display:none;margin-top:10px;">
      <pre class="log-pre"></pre>
    </div>
  </section>
</main>

<div class="toast-wrap">
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
</div>

<script src="{{ url_for('static', filename='dispatcher.js') }}"></script>
</body>
</html>
