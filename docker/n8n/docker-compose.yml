services:
  n8n:
    image: n8nio/n8n:latest
    container_name: miru-n8n
    restart: unless-stopped
    ports:
      - "15678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - D:\dev\miru\data:/miru-data
    environment:
      N8N_HOST: room.taila28611.ts.net
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://room.taila28611.ts.net/
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: America/Los_Angeles
      TZ: America/Los_Angeles
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CALLBACK_SECRET: ${TELEGRAM_CALLBACK_SECRET}
      W4_LISTENER_HMAC_SECRET: ${W4_LISTENER_HMAC_SECRET}
      W2_SHADOW_MODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "fs,crypto"
      # Used by W7 MCP n8n-write approval branch + notify workflow to call the
      # local n8n Public API from inside the container (5678 = internal port).
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_INTERNAL_API_BASE: "http://127.0.0.1:5678"

volumes:
  n8n_data:
    name: n8n_data
